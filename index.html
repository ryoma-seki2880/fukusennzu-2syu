<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>複線図練習 R8 第二種電気工事士</title>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--ink:#1a1a1a;--sub:#5b6270;--line:#d9dce2;--acc:#1f5fbf;--ok:#1b8a3a;--ng:#c62828;--warn:#b26a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:15px;margin:0;white-space:nowrap;font-weight:700}
#sel{min-width:0;flex:1 1 auto;max-width:420px}
@media (max-width:520px){header h1{display:none}}
#rot{display:none;position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--sub);pointer-events:none}
@media (orientation:portrait){#rot{display:block}}
@media (orientation:portrait){#tools{flex-wrap:wrap;overflow:visible}#tools .tb{flex:1 1 17%;min-width:0;padding:0 4px;font-size:13px}#tools .sep{display:none}}
header .sp{flex:1}
select,button,option{font:inherit;color:#1a1a1a;background-color:#fff;-webkit-text-fill-color:currentColor}
.tb.primary{-webkit-text-fill-color:#fff}
#sel{font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;white-space:nowrap;flex:0 0 auto}
#main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#stage{flex:1 1 auto;position:relative;min-width:0;min-height:0;background:#fff}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:8px;top:6px;font-size:12px;color:var(--sub);pointer-events:none;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:6px}
#tools{flex:0 0 auto;display:flex;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);overflow-x:auto;align-items:center}
.tb{flex:0 0 auto;min-width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;color:var(--ink)}
.tb.on{outline:3px solid var(--acc);outline-offset:-1px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #333;display:inline-block}
.tb.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.sep{width:1px;height:30px;background:var(--line);flex:0 0 auto}
@media (orientation:landscape) and (max-height:560px){
  header{padding:3px 8px} header h1{font-size:13px}
  #main{flex-direction:row}
  body{flex-direction:column}
  #tools{flex-direction:column;border-top:none;border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:4px calc(4px + env(safe-area-inset-right)) 4px 4px;height:100%}
  #tools{display:grid;grid-template-columns:repeat(2,58px);grid-auto-rows:42px;gap:5px;align-content:start}
  .tb{min-width:0;width:58px;height:42px;font-size:12px;padding:0 4px;gap:3px}
  .tb .sw{width:16px;height:16px}
  .sep{display:none}
  #wrap{flex-direction:row !important}
}
#wrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62dvh;background:#fff;border-top-left-radius:16px;border-top-right-radius:16px;box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
#sheet .hd{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
#sheet .hd b{font-size:16px;flex:1}
#sheet .bd{overflow:auto;padding:10px 14px 18px;font-size:14px;line-height:1.6;-webkit-user-select:text;user-select:text}
.verdict{font-size:18px;font-weight:800;margin:2px 0 8px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.msg{display:flex;gap:6px;padding:5px 0;border-bottom:1px dashed #eceef2}
.msg .ic{flex:0 0 20px;font-weight:800}
.msg.ng .ic{color:var(--ng)} .msg.warn .ic{color:var(--warn)} .msg.ok .ic{color:var(--ok)}
.cond h3{font-size:14px;margin:10px 0 4px}
.cond ul{margin:0;padding-left:18px}
.note{font-size:12px;color:var(--sub);margin-top:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:30}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:14px;padding:18px;width:min(320px,86vw);text-align:center}
#modal .row{display:flex;gap:8px;margin-top:14px}
#modal .row button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700}
#modal .row .danger{background:var(--ng);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--ng)}
.toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:rgba(20,20,20,.86);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>複線図練習 <span style="color:var(--sub);font-weight:600">R8 第二種</span></h1>
  <select id="sel" aria-label="候補問題"></select>
  <span class="sp"></span>
  <button class="hbtn" id="bInfo">条件</button>
  <button class="hbtn" id="bFit">全体</button>
</header>
<div id="wrap">
<div id="main">
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
      <g id="gBase"></g>
      <g id="gAns" style="display:none"></g>
      <g id="gWires"></g>
      <g id="gJoints"></g>
      <g id="gLive"></g>
    </svg>
    <div id="hint">1本指で描く・2本指で拡大/移動</div>
    <div id="rot">📱 横向きにすると大きく描けます</div>
  </div>
  <div id="tools">
    <button class="tb on" data-c="k" title="黒"><span class="sw" style="background:#1a1a1a"></span>黒</button>
    <button class="tb" data-c="w" title="白"><span class="sw" style="background:#fff;border-color:#888"></span>白</button>
    <button class="tb" data-c="r" title="赤"><span class="sw" style="background:#d62828"></span>赤</button>
    <button class="tb" data-c="g" title="緑"><span class="sw" style="background:#1b8a3a"></span>緑</button>
    <span class="sep"></span>
    <button class="tb" id="bErase">消しゴム</button>
    <button class="tb" id="bUndo">戻す</button>
    <button class="tb" id="bClear">全消去</button>
    <span class="sep"></span>
    <button class="tb" id="bAns">正解</button>
    <button class="tb primary" id="bCheck">判定</button>
  </div>
</div>
</div>

<div id="sheet"><div class="hd"><b id="shTitle">結果</b><button class="hbtn" id="shClose">閉じる</button></div><div class="bd" id="shBody"></div></div>
<div id="modal"><div class="box"><div id="mText">この問題の線をすべて消しますか？</div><div class="row"><button id="mNo">やめる</button><button class="danger" id="mYes">消す</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ============ 部品定義 ============ */
const NS="http://www.w3.org/2000/svg";
const COL={k:"#1a1a1a",w:"#ffffff",r:"#d62828",g:"#1b8a3a"};
const COLNAME={k:"黒",w:"白",r:"赤",g:"緑"};
const ROLECOL={N:"w",L:"k",E:"g",R:"r",S:"w",T:"k"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||30}" font-weight="${o.fw||800}" text-anchor="${o.a||'start'}" fill="${o.fill||'#1a1a1a'}" ${o.ff?`font-family="${o.ff}"`:""}>${esc(s)}</text>`;
const TC=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r||8}" fill="#fff" stroke="#1a1a1a" stroke-width="2.6"/>`;
const TD=(x,y)=>`<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="#1a1a1a" stroke-width="2.2"/>`;
function side2(x,y,s,hw,hh,off){ // 2端子を指定辺に配置
  off=off==null?Math.min(hw,hh)*0.55:off;
  switch(s){case"t":return[[x-off,y-hh],[x+off,y-hh]];case"l":return[[x-hw,y-off],[x-hw,y+off]];case"r":return[[x+hw,y-off],[x+hw,y+off]];default:return[[x-off,y+hh],[x+off,y+hh]];}
}
function lab(c,dx,dy){ if(!c.label) return ""; const x=c.x+(c.lx!=null?c.lx:dx), y=c.y+(c.ly!=null?c.ly:dy); return T(x,y,c.label,{fs:c.lfs||32}); }

const TYPES={
  ceilK:{name:"引掛シーリング(角)",sym:[["a","b"]],draw(c){const p=side2(c.x,c.y,c.side||"b",50,28,30);
    return{svg:`<rect x="${c.x-50}" y="${c.y-28}" width="100" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/>`+T(c.x,c.y+11,"( )",{fs:30,fw:400,a:"middle"})+p.map(q=>TD(q[0],q[1])).join("")+lab(c,62,12),terms:[{k:"a",x:p[0][0],y:p[0][1]},{k:"b",x:p[1][0],y:p[1][1]}]}}},
  ceilM:{name:"引掛シーリング(丸)",sym:[["a","b"]],draw(c){const p=side2(c.x,c.y,c.side||"b",34,34,20);
    return{svg:`<circle cx="${c.x}" cy="${c.y}" r="34" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/>`+T(c.x,c.y+10,"( )",{fs:26,fw:400,a:"middle"})+p.map(q=>TD(q[0],q[1])).join("")+lab(c,46,12),terms:[{k:"a",x:p[0][0],y:p[0][1]},{k:"b",x:p[1][0],y:p[1][1]}]}}},
  R:{name:"ランプレセプタクル",sym:[["a","b"]],draw(c){const p=side2(c.x,c.y,c.side||"b",42,42,22);
    return{svg:`<circle cx="${c.x}" cy="${c.y}" r="42" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/>`+T(c.x,c.y+17,"R",{fs:50,fw:400,a:"middle",ff:"Times New Roman,serif"})+p.map(q=>TD(q[0],q[1])).join("")+lab(c,54,14),terms:[{k:"a",x:p[0][0],y:p[0][1]},{k:"b",x:p[1][0],y:p[1][1]}]}}},
  LX:{name:"照明器具",sym:[["a","b"]],draw(c){const p=side2(c.x,c.y,c.side||"b",30,30,18);const d=21;
    return{svg:`<circle cx="${c.x}" cy="${c.y}" r="30" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/><path d="M${c.x-d} ${c.y-d}L${c.x+d} ${c.y+d}M${c.x+d} ${c.y-d}L${c.x-d} ${c.y+d}" stroke="#1a1a1a" stroke-width="3"/>`+p.map(q=>TD(q[0],q[1])).join("")+lab(c,42,12),terms:[{k:"a",x:p[0][0],y:p[0][1]},{k:"b",x:p[1][0],y:p[1][1]}]}}},
  FL:{name:"蛍光灯",sym:[["a","b"]],draw(c){const sd=c.side||"t";const p=side2(c.x,c.y,sd,80,24,(sd==="l"||sd==="r")?12:58);
    return{svg:`<rect x="${c.x-80}" y="${c.y-24}" width="160" height="48" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/><ellipse cx="${c.x}" cy="${c.y}" rx="41" ry="38" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/>`+p.map(q=>TD(q[0],q[1])).join("")+lab(c,100,12),terms:[{k:"a",x:p[0][0],y:p[0][1]},{k:"b",x:p[1][0],y:p[1][1]}]}}},
  M:{name:"電動機",sym:"all3",draw(c){const s=c.side||"l";let pts;
    if(s==="l")pts=[[c.x-29,c.y-17],[c.x-34,c.y],[c.x-29,c.y+17]];else if(s==="t")pts=[[c.x-17,c.y-29],[c.x,c.y-34],[c.x+17,c.y-29]];else if(s==="r")pts=[[c.x+29,c.y-17],[c.x+34,c.y],[c.x+29,c.y+17]];else pts=[[c.x-17,c.y+29],[c.x,c.y+34],[c.x+17,c.y+29]];
    return{svg:`<circle cx="${c.x}" cy="${c.y}" r="34" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/>`+T(c.x,c.y+12,"M",{fs:34,fw:700,a:"middle"})+pts.map(q=>TD(q[0],q[1])).join("")+lab(c,46,12),terms:["u","v","w"].map((k,i)=>({k,x:pts[i][0],y:pts[i][1]}))}}},
  OUT:{name:"コンセント",sym:[["a","b"]],draw(c){const s=c.side||"t";const p=side2(c.x,c.y,s,30,24,16);const terms=[{k:"a",x:p[0][0],y:p[0][1]},{k:"b",x:p[1][0],y:p[1][1]}];
    let g=`<rect x="${c.x-30}" y="${c.y-24}" width="60" height="48" rx="7" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/><path d="M${c.x-10} ${c.y-10}v16M${c.x+10} ${c.y-10}v16" stroke="#1a1a1a" stroke-width="4"/>`;
    if(c.e){const ex=s==="r"?c.x-30:c.x+30, ey=s==="t"?c.y+10:(s==="b"?c.y-10:c.y);terms.push({k:"e",x:ex,y:ey,lab:"E"});g+=`<path d="M${c.x-4} ${c.y+12}a4 4 0 0 0 8 0" fill="none" stroke="#1a1a1a" stroke-width="3"/>`+T(ex+(s==="r"?-18:8),ey+(s==="t"?24:-8),"E",{fs:16,fw:700});}
    if(c.txt)g+=T(c.x,c.y+(s==="t"?50:-32),c.txt,{fs:17,fw:700,a:"middle"});
    return{svg:g+terms.map(q=>TD(q.x,q.y)).join("")+lab(c,c.e?52:42,12),terms}}},
  SW:{name:"スイッチ",sym:[["a","b"]],draw(c){const x=c.x,y=c.y;let g=`<path d="M${x-25} ${y-21}L${x+30} ${y-2}" stroke="#1a1a1a" stroke-width="4.5"/>`;
    if(c.h){g+=`<path d="M${x-39} ${y-9}V${y-67}H${x-18}M${x+18} ${y-67}H${x+39}V${y-9}" fill="none" stroke="#1a1a1a" stroke-width="4"/><circle cx="${x}" cy="${y-67}" r="18" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/>`;}
    g+=TC(x-39,y,9)+TC(x+39,y,9);const L=(c.h?"H ":"")+(c.label||"");if(L)g+=T(x+(c.lx!=null?c.lx:76),y+(c.ly!=null?c.ly:12),L,{fs:30});
    return{svg:g,terms:[{k:"a",x:x-39,y},{k:"b",x:x+39,y}]}}},
  PL:{name:"確認表示灯",sym:[["a","b"]],draw(c){const x=c.x,y=c.y,d=11;
    return{svg:`<path d="M${x-38} ${y}H${x-17}M${x+17} ${y}H${x+38}" stroke="#1a1a1a" stroke-width="3.5"/><circle cx="${x}" cy="${y}" r="17" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"/><path d="M${x-d} ${y-d}L${x+d} ${y+d}M${x+d} ${y-d}L${x-d} ${y+d}" stroke="#1a1a1a" stroke-width="3"/>`+TC(x-38,y,8)+TC(x+38,y,8)+(c.label?T(x+(c.lx!=null?c.lx:54),y+(c.ly!=null?c.ly:9),c.label,{fs:c.lfs||22,fw:700}):""),
      terms:[{k:"a",x:x-38,y},{k:"b",x:x+38,y}]}}},
  W3:{name:"3路スイッチ",sym:[["1","3"]],draw(c){const f=c.flip?-1:1,x=c.x,y=c.y;const P=(dx,dy)=>[x+dx*f,y+dy];
    const t0=P(-40,0),t1=P(40,-20),t3=P(40,20);
    let g=`<path d="M${P(-30,-4)}L${P(29,-16)}" stroke="#1a1a1a" stroke-width="4.5"/>`.replace(/,/g," ");
    g+=TC(...t0,9)+TC(...t1,9)+TC(...t3,9)+T(t0[0]+(f>0?-6:6),t0[1]+30,"0",{fs:17,fw:700,a:"middle"})+T(t1[0]+16*f,t1[1]-4,"1",{fs:17,fw:700,a:f>0?"start":"end"})+T(t3[0]+16*f,t3[1]+16,"3",{fs:17,fw:700,a:f>0?"start":"end"});
    if(c.label)g+=T(x+(c.lx!=null?c.lx:(f>0?66:-66)),y+(c.ly!=null?c.ly:10),c.label,{fs:28,a:f>0?"start":"end"});
    return{svg:g,terms:[{k:"0",x:t0[0],y:t0[1],lab:"0"},{k:"1",x:t1[0],y:t1[1],lab:"1"},{k:"3",x:t3[0],y:t3[1],lab:"3"}]}}},
  W4:{name:"4路スイッチ",sym:"w4",draw(c){const x=c.x,y=c.y;const pts={"2":[x-40,y-20],"4":[x-40,y+20],"1":[x+40,y-20],"3":[x+40,y+20]};
    let g=`<rect x="${x-28}" y="${y-34}" width="56" height="68" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="3 3"/><path d="M${x-30} ${y-20}H${x+30}M${x-30} ${y+20}H${x+30}" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="6 4"/>`;
    for(const k in pts){g+=TC(pts[k][0],pts[k][1],9);g+=T(pts[k][0]+(pts[k][0]<x?-14:14),pts[k][1]+(pts[k][1]<y?-6:18),k,{fs:17,fw:700,a:"middle"});}
    g+=T(x,y+6,"4",{fs:20,fw:800,a:"middle"});if(c.label)g+=T(x+(c.lx!=null?c.lx:66),y+(c.ly!=null?c.ly:10),c.label,{fs:28});
    return{svg:g,terms:Object.keys(pts).map(k=>({k,x:pts[k][0],y:pts[k][1],lab:k}))}}},
  TB:{name:"端子台",sym:null,draw(c){ // 横一列の端子台（タイムスイッチ・自動点滅器の代用）
    const n=c.keys.length,w=n*52+12,x0=c.x-w/2,top=c.side==="b";const ty=top?c.y+26:c.y-26;
    let g=`<rect x="${x0}" y="${c.y-26}" width="${w}" height="52" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>`;const terms=[];
    c.keys.forEach((k,i)=>{const tx=x0+32+i*52;terms.push({k:k,x:tx,y:ty,lab:k});g+=TC(tx,ty,8)+T(tx,c.y+(top?-2:14),k,{fs:18,fw:700,a:"middle"});});
    if(c.label)g+=T(c.x+(c.lx!=null?c.lx:w/2+12),c.y+(c.ly!=null?c.ly:10),c.label,{fs:c.lfs||26});
    return{svg:g,terms}}},
  RL:{name:"リモコンリレー",sym:"rl",draw(c){ // 6極端子台：イ・イ・ロ・ロ・ハ・ハ を上辺に一列
    const S=c.pitch||48,n=c.rows.length*2,w=n*S+24,h=78,x0=c.x-w/2,y0=c.y-h/2;let g=`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="5" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>`;const terms=[];
    c.rows.forEach((r,i)=>{const xa=x0+12+S/2+(2*i)*S,xb=xa+S;terms.push({k:r+"a",x:xa,y:y0,lab:r},{k:r+"b",x:xb,y:y0,lab:r});
      g+=TC(xa,y0,9)+TC(xb,y0,9)+T((xa+xb)/2,y0+52,r,{fs:26,a:"middle"})+`<path d="M${xa} ${y0+14}V${y0+26}H${xb}V${y0+14}" fill="none" stroke="#1a1a1a" stroke-width="2"/>`;
      if(i>0)g+=`<path d="M${xa-S/2} ${y0+8}V${y0+h-8}" stroke="#9aa0a8" stroke-width="2"/>`;});
    if(c.label)g+=T(c.x+(c.lx!=null?c.lx:0),c.y+(c.ly!=null?c.ly:h/2+28),c.label,{fs:20,fw:700,a:"middle"});
    return{svg:g,terms}}},

function bboxOf(c,terms){const x=c.x,y=c.y;let b;

  case"OUT":b=[x-30,y-24,x+30,y+24];break;case"SW":b=c.h?[x-46,y-88,x+46,y]:[x-39,y-22,x+39,y];break;case"PL":b=[x-38,y-17,x+38,y+17];break;
  case"W3":b=[x-40,y-20,x+40,y+20];break;case"W4":b=[x-40,y-34,x+40,y+34];break;

  }

function netTerms(n){const s=new Set();for(const k in n){if(/^J\d$/.test(k))n[k].forEach(t=>s.add(t));}(n.direct||[]).forEach(e=>{s.add(e[0]);s.add(e[1]);});return[...s];}

// 正解図の線分：同じ位置の器具はボックスから1本＋渡り線、色はケーブル（2心＝黒白、3心＝黒白赤）単位で決める
function modelSegs(p){

      for(const L in byLoc){const ts=byLoc[L];const tp=T(ts[0]);
        add({net:ni,ax:tp.x,ay:tp.y,bx:J.x,by:J.y,a:"T:"+ts[0],b:jid,pri:1,cab:L+"|"+bk,loc:L,sa:{loc:L},sb:{box:bk}});
        for(let i=1;i<ts.length;i++){const A=T(ts[i-1]),C=T(ts[i]);add({net:ni,ax:A.x,ay:A.y,bx:C.x,by:C.y,a:"T:"+ts[i-1],b:"T:"+ts[i],pri:2,jmp:L});}}});
    for(let i=0;i+1<keys.length;i++){const A=jpos[keys[i]+"/"+ni],C=jpos[keys[i+1]+"/"+ni];add({net:ni,ax:A.x,ay:A.y,bx:C.x,by:C.y,a:"M"+keys[i]+"_"+ni,b:"M"+keys[i+1]+"_"+ni,pri:0,cab:[keys[i],keys[i+1]].sort().join("|"),sa:{box:keys[i]},sb:{box:keys[i+1]}});}
    (n.direct||[]).forEach(e=>{const A=T(e[0]),C=T(e[1]);const la=loc(e[0]),lb=loc(e[1]);
      if(la===lb)add({net:ni,ax:A.x,ay:A.y,bx:C.x,by:C.y,a:"T:"+e[0],b:"T:"+e[1],pri:2,jmp:la});
      else add({net:ni,ax:A.x,ay:A.y,bx:C.x,by:C.y,a:"T:"+e[0],b:"T:"+e[1],pri:1,cab:[la,lb].sort().join("|"),loc:la,sa:{loc:la},sb:{loc:lb}});});
  });
  // ケーブルごとの色決め
  const FIX={N:"w",L:"k",E:"g",R:"r",S:"w",T:"k"};const cabs={};
  segs.forEach(sg=>{if(sg.cab)(cabs[sg.cab]=cabs[sg.cab]||[]).push(sg);});
  for(const k in cabs){const ws=cabs[k];const nonE=ws.filter(w=>p.nets[w.net].role!=="E");const m=nonE.length;
    const pal=m<=1?["k","w"]:m===2?["k","w"]:m===3?["k","w","r"]:m===4?["k","w","k","w"]:m===5?["k","w","r","k","w"]:["k","w","r","k","w","r"];
    const left=pal.slice();const take=c=>{const i=left.indexOf(c);if(i>=0){left.splice(i,1);return c;}return null;};

// 直交経路：同じケーブルの線は1本の経路に沿って並走させ、端子とボックス内の接続点でだけ分かれる
function routeAll(segs,B,ctx){
  segs.forEach((g,i)=>g._i=i);
  const T=Object.values(B.terms);const SH=[];for(const [id,v] of Object.entries(B.compById))for(const sh of v.shapes)SH.push(Object.assign({id},sh));

  const JN={};segs.forEach(g=>{if(g.a&&!g.a.startsWith("T:"))JN[g.a]=[g.ax,g.ay];if(g.b&&!g.b.startsWith("T:"))JN[g.b]=[g.bx,g.by];});const JL=Object.entries(JN);
  const segPt=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1];const L=dx*dx+dy*dy;let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(a[0]+t*dx-p[0],a[1]+t*dy-p[1]);};

  const hitShape=(a,b,sh,m)=>{if(sh.t==="c")return segPt([sh.x,sh.y],a,b)<sh.r-m;const r=sh.b;const x0=r[0]+m,y0=r[1]+m,x1=r[2]-m,y1=r[3]-m;if(x0>=x1||y0>=y1)return false;
    if(Math.abs(a[1]-b[1])<0.01){const y=a[1];return y>y0&&y<y1&&Math.max(a[0],b[0])>x0&&Math.min(a[0],b[0])<x1;}
    if(Math.abs(a[0]-b[0])<0.01){const x=a[0];return x>x0&&x<x1&&Math.max(a[1],b[1])>y0&&Math.min(a[1],b[1])<y1;}
    const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2);for(let k=1;k<n;k++){const x=a[0]+(b[0]-a[0])*k/n,y=a[1]+(b[1]-a[1])*k/n;if(x>x0&&x<x1&&y>y0&&y<y1)return true;}return false;};
  const labs=Object.values(B.compById).filter(v=>v.c.t==="SW"&&(v.c.label||v.c.h)&&v.c.lx==null).map(v=>{const n=((v.c.h?"H ":"")+(v.c.label||"")).length;return[v.c.x+72,v.c.y-20,v.c.x+80+n*24,v.c.y+16];});

  const isJ=id=>!id.startsWith("T:");
  const exitsOf=t=>{const cc=B.compById[t.comp].c;if(cc.t==="SW")return t.k==="a"?[[-1,0],[0,1]]:[[1,0],[0,1]];const bb=B.compById[t.comp].bb;const d=[];const e=3;
    if(Math.abs(t.y-bb[3])<e)d.push([0,1]);if(Math.abs(t.y-bb[1])<e)d.push([0,-1]);if(Math.abs(t.x-bb[0])<e)d.push([-1,0]);if(Math.abs(t.x-bb[2])<e)d.push([1,0]);
    if(!d.length){const cx=(bb[0]+bb[2])/2,cy=(bb[1]+bb[3])/2;const dx=t.x-cx,dy=t.y-cy;d.push(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx)||1,0]:[0,Math.sign(dy)||1]);}
    return d;};
  const pieces=pts=>{const r=[];for(let i=0;i+1<pts.length;i++){const[p,q]=[pts[i],pts[i+1]];if(Math.abs(p[1]-q[1])<0.01&&Math.abs(p[0]-q[0])>0.01)r.push({o:"h",c:p[1],a:Math.min(p[0],q[0]),b:Math.max(p[0],q[0]),i});else if(Math.abs(p[0]-q[0])<0.01&&Math.abs(p[1]-q[1])>0.01)r.push({o:"v",c:p[0],a:Math.min(p[1],q[1]),b:Math.max(p[1],q[1]),i});else if(Math.hypot(p[0]-q[0],p[1]-q[1])>0.01)r.push({o:"d",i});}return r;};
  const merge=pts=>{pts=pts.filter((p,k,a)=>k===0||Math.hypot(p[0]-a[k-1][0],p[1]-a[k-1][1])>0.01);const q=[pts[0]];for(let k=1;k<pts.length;k++){const a=q[q.length-1],b=pts[k],c=pts[k+1];if(c&&((Math.abs(a[0]-b[0])<0.01&&Math.abs(b[0]-c[0])<0.01)||(Math.abs(a[1]-b[1])<0.01&&Math.abs(b[1]-c[1])<0.01)))continue;q.push(b);}return q;};

/* ============ 判定 ============ */
function permsFor(p){ // 器具ごとの「入れ替えても同じ」端子の組合せ
  const B=build(p);const per=[];
  for(const id in B.compById){const {c,ty}=B.compById[id];const s=ty.sym;let maps=[{}];
    const sw=(a,b)=>({[id+"."+a]:id+"."+b,[id+"."+b]:id+"."+a});
    if(Array.isArray(s)){for(const g of s){const nm=[];for(const m of maps){nm.push(m);nm.push(Object.assign({},m,sw(g[0],g[1])));}maps=nm;}}
    else if(s==="all3"){const k=["u","v","w"];const ps=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];maps=ps.map(pp=>{const m={};k.forEach((kk,i)=>m[id+"."+kk]=id+"."+k[pp[i]]);return m;});}
    else if(s==="w4"){maps=[];const L=["2","4"],R=["1","3"];for(const side of[0,1])for(const sl of[0,1])for(const sr of[0,1]){let a=sl?[L[1],L[0]]:L.slice(),b=sr?[R[1],R[0]]:R.slice();if(side)[a,b]=[b,a];const m={};m[id+".2"]=id+"."+a[0];m[id+".4"]=id+"."+a[1];m[id+".1"]=id+"."+b[0];m[id+".3"]=id+"."+b[1];maps.push(m);}}
    else if(s==="rl"){for(const r of c.rows){const nm=[];for(const m of maps){nm.push(m);nm.push(Object.assign({},m,sw(r+"a",r+"b")));}maps=nm;}}
    if(maps.length>1)per.push(maps);
  }
  return per;
}
function* product(arr,i=0,acc={}){if(i===arr.length){yield acc;return;}for(const m of arr[i])yield* product(arr,i+1,Object.assign({},acc,m));}

function check(p,st){
  const B=build(p);const all=[];p.nets.forEach(n=>netTerms(n).forEach(t=>{if(!all.includes(t))all.push(t);}));
  // union-find
  const par={};const f=x=>{if(par[x]==null)par[x]=x;while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;};const u=(a,b)=>{par[f(a)]=f(b);};
  const deg={};let dangling=0;
  for(const w of st.wires){if(w.a)deg[w.a]=(deg[w.a]||0)+1;if(w.b)deg[w.b]=(deg[w.b]||0)+1;if(!w.a||!w.b){dangling++;}if(w.a&&w.b)u(w.a,w.b);}
  const root=t=>f("T:"+t);
  // 最適な端子の入れ替えを探索
  const per=permsFor(p);let best=null;
  for(const m of product(per)){
    const expOf={};p.nets.forEach((n,ni)=>netTerms(n).forEach(t=>{expOf[m[t]||t]=ni;}));
    let mis=0;for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],b=all[j];if((expOf[a]===expOf[b])!==(root(a)===root(b)))mis++;}
    if(!best||mis<best.mis)best={mis,expOf};if(mis===0)break;
  }
  const msgs=[];const expOf=best.expOf;
  const unwired=all.filter(t=>!deg["T:"+t]);
  if(unwired.length) msgs.push({lv:"ng",t:"まだ線がつながっていない端子："+unwired.map(t=>B.terms[t].name).join("、")});
  // 誤接続
  const groups={};all.forEach(t=>{if(!deg["T:"+t])return;const r=root(t);(groups[r]=groups[r]||[]).push(t);});
  for(const r in groups){const g=groups[r];const nets=[...new Set(g.map(t=>expOf[t]))];
    if(nets.length>1){const srcs=g.filter(t=>B.terms[t].role);const roles=[...new Set(srcs.map(t=>B.terms[t].role))];
      if(roles.length>1) msgs.push({lv:"ng",t:"⚡ 短絡（ショート）："+srcs.map(t=>B.terms[t].name).join(" と ")+" がつながっています"});
      msgs.push({lv:"ng",t:"誤接続："+nets.map(ni=>"［"+netName(p.nets[ni])+"］").join(" と ")+" が同じ線でつながっています（"+g.map(t=>B.terms[t].name).join("、")+"）"});}
  }
  // 未接続（途中で切れている）
  p.nets.forEach((n,ni)=>{const ts=all.filter(t=>expOf[t]===ni&&deg["T:"+t]);const rs=[...new Set(ts.map(root))];
    if(rs.length>1){const parts=rs.map(r=>ts.filter(t=>root(t)===r).map(t=>B.terms[t].name).join("・"));msgs.push({lv:"ng",t:"未接続：［"+netName(n)+"］が分かれています → "+parts.map(s=>"〈"+s+"〉").join(" / ")});}});
  // 色
  const colorErr={};
  for(const w of st.wires){if(!w.a&&!w.b)continue;const r=f(w.a||w.b);const srcs=all.filter(t=>B.terms[t].role&&root(t)===r);const roles=[...new Set(srcs.map(t=>B.terms[t].role))];
    if(roles.length!==1)continue;const need=ROLECOL[roles[0]];if(need&&w.c!==need){const key=roles[0];colorErr[key]=colorErr[key]||{need,n:0};colorErr[key].n++;}}
  const rn={N:"電源の接地側",L:"電源の非接地側",E:"接地線",R:"R相",S:"S相",T:"T相"};
  for(const k in colorErr) msgs.push({lv:"ng",t:"色の誤り："+rn[k]+"につながる線は"+COLNAME[colorErr[k].need]+"にします（違う色が"+colorErr[k].n+"本）"});
  if(dangling) msgs.push({lv:"warn",t:"端子・接続点につながっていない線の端が "+dangling+" 本あります"});
  // 接続点の情報
  const jinfo=Object.values(st.joints).map(j=>deg[j.id]||0);const single=jinfo.filter(d=>d===1).length;
  if(single) msgs.push({lv:"warn",t:"ボックス内で1本だけの接続点が "+single+" か所あります（つなぎ忘れ？）"});
  const pass=best.mis===0&&unwired.length===0&&!Object.keys(colorErr).length;
  return{pass,msgs,joints:jinfo.filter(d=>d>=2).length};
}

/* ============ アプリ状態 ============ */
const svg=document.getElementById("svg"),gBase=document.getElementById("gBase"),gW=document.getElementById("gWires"),gJ=document.getElementById("gJoints"),gL=document.getElementById("gLive"),gA=document.getElementById("gAns");
let pi=0,st=null,color="k",erase=false,undo=[],showAns=false;
const VB0={x:0,y:0,w:1280,h:720};let vb={...VB0};
const KEY="fukusen_r8_v1_";
function load(i){try{const s=localStorage.getItem(KEY+P[i].no);if(s)return JSON.parse(s);}catch(e){}return{wires:[],joints:{},seq:1};}
function save(){try{localStorage.setItem(KEY+P[pi].no,JSON.stringify(st));localStorage.setItem(KEY+"last",String(pi));}catch(e){}}
function snap(){undo.push(JSON.stringify(st));if(undo.length>80)undo.shift();}

function setProblem(i){pi=i;st=load(i);undo=[];const p=P[i];const B=build(p);
  gBase.innerHTML=`<rect x="-2000" y="-2000" width="5280" height="4720" fill="#fff"/>`+B.svg;
  document.getElementById("sel").value=String(i);showAns=false;gA.style.display="none";document.getElementById("bAns").classList.remove("on");
  drawAns();fit();render();closeSheet();}
function fit(){vb={...VB0};applyVB();}
function applyVB(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}

function pathD(pts){if(pts.length<2)return"";let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  if(pts.length===2)return d+`L${pts[1][0].toFixed(1)} ${pts[1][1].toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=`Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;}
  const l=pts[pts.length-1];return d+`L${l[0].toFixed(1)} ${l[1].toFixed(1)}`;}
function wireSVG(d,c,extra=""){if(c==="w")return`<path d="${d}" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ${extra}/><path d="${d}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  return`<path d="${d}" fill="none" stroke="${COL[c]}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;}
function render(){let h="";for(const w of st.wires){const d=pathD(w.pts);h+=`<g data-wid="${w.id}">${wireSVG(d,w.c)}<path d="${d}" fill="none" stroke="transparent" stroke-width="26" stroke-linecap="round"/>`;
    if(!w.a)h+=`<circle cx="${w.pts[0][0]}" cy="${w.pts[0][1]}" r="7" fill="none" stroke="#c62828" stroke-width="3"/>`;
    if(!w.b){const l=w.pts[w.pts.length-1];h+=`<circle cx="${l[0]}" cy="${l[1]}" r="7" fill="none" stroke="#c62828" stroke-width="3"/>`;}h+=`</g>`;}
  gW.innerHTML=h;const deg={};st.wires.forEach(w=>{if(w.a)deg[w.a]=(deg[w.a]||0)+1;if(w.b)deg[w.b]=(deg[w.b]||0)+1;});
  let j="";for(const id in st.joints){const p=st.joints[id];const dg=deg[id]||0;j+=dg>=2?`<circle cx="${p.x}" cy="${p.y}" r="6" fill="#1a1a1a"/>`:`<circle cx="${p.x}" cy="${p.y}" r="5.5" fill="#fff" stroke="#1a1a1a" stroke-width="2.4"/>`;}
  gJ.innerHTML=j;save();}
function drawAns(){const p=P[pi];const {segs,joints}=modelSegs(p);let h=`<g opacity="0.8">`;
  for(const s of segs)h+=wireSVG("M"+s.pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L"),s.c);
  for(const j of joints)h+=`<circle cx="${j.x}" cy="${j.y}" r="6" fill="#1f5fbf"/>`;h+=`</g>`;gA.innerHTML=h;}

/* ============ 入力 ============ */
const ptrs=new Map();let cur=null,pinch=null;
function toSVG(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();return pt.matrixTransform(m.inverse());}
function snapR(){const m=svg.getScreenCTM();const sc=m?m.a:1;return Math.max(14,Math.min(60,30/sc));}
function boxAt(x,y){for(const b of P[pi].boxes){if(b.type==="jb"){if(Math.hypot(x-b.x,y-b.y)<=b.r)return b;}else if(Math.abs(x-b.x)<=b.r&&Math.abs(y-b.y)<=b.r)return b;}return null;}
function findNode(x,y){const R=snapR();const B=build(P[pi]);let best=null,bd=R;
  for(const id in B.terms){const t=B.terms[id];const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;best={id:"T:"+id,x:t.x,y:t.y};}}
  for(const id in st.joints){const j=st.joints[id];const d=Math.hypot(j.x-x,j.y-y);if(d<bd*1.05){bd=d;best={id,x:j.x,y:j.y};}}
  if(best)return best;const b=boxAt(x,y);if(b)return{id:null,newJoint:true,x,y,box:b.id};return null;}
function eraseAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);const g=el&&el.closest&&el.closest("[data-wid]");if(g){const id=+g.getAttribute("data-wid");snap();st.wires=st.wires.filter(w=>w.id!==id);cleanJoints();render();}}
function cleanJoints(){const used=new Set();st.wires.forEach(w=>{used.add(w.a);used.add(w.b);});for(const id in st.joints)if(!used.has(id))delete st.joints[id];}
function liveDraw(){if(!cur){gL.innerHTML="";return;}let h=wireSVG(pathD(cur.pts),color,'opacity="0.9"');
  const l=cur.pts[cur.pts.length-1];const n=findNode(l[0],l[1]);
  if(n&&n.id)h+=`<circle cx="${n.x}" cy="${n.y}" r="16" fill="rgba(31,95,191,.18)" stroke="#1f5fbf" stroke-width="3"/>`;
  else if(n&&n.newJoint)h+=`<circle cx="${n.x}" cy="${n.y}" r="10" fill="none" stroke="#1f5fbf" stroke-width="3" stroke-dasharray="4 3"/>`;
  if(cur.s&&cur.s.id)h+=`<circle cx="${cur.s.x}" cy="${cur.s.y}" r="14" fill="none" stroke="#1f5fbf" stroke-width="3"/>`;gL.innerHTML=h;}
svg.addEventListener("pointerdown",e=>{e.preventDefault();svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){cur=null;liveDraw();const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,vb:{...vb}};return;}
  if(ptrs.size>2)return;
  if(erase){eraseAt(e);cur={erase:true};return;}
  const p=toSVG(e);const s=findNode(p.x,p.y);cur={pts:[[p.x,p.y]],s};liveDraw();});
svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const r=svg.getBoundingClientRect();const k=Math.max(0.2,Math.min(5,pinch.d/d));const v0=pinch.vb;
    const sc=Math.min(r.width/v0.w,r.height/v0.h);// px per unit (meet)
    const w=Math.max(160,Math.min(2600,v0.w*k)),h=w*v0.h/v0.w;const kk=w/v0.w;
    // ピンチ中心を固定
    const ox=(r.width-v0.w*sc)/2,oy=(r.height-v0.h*sc)/2;const ux=v0.x+(pinch.mx-r.left-ox)/sc,uy=v0.y+(pinch.my-r.top-oy)/sc;
    const sc2=sc/kk;vb={x:ux-(mx-r.left-ox)/sc2,y:uy-(my-r.top-oy)/sc2,w,h};applyVB();return;}
  if(!cur)return;if(cur.erase){eraseAt(e);return;}
  const p=toSVG(e);const l=cur.pts[cur.pts.length-1];if(Math.hypot(p.x-l[0],p.y-l[1])>=2.5){cur.pts.push([p.x,p.y]);liveDraw();}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;cur=null;liveDraw();return;}
  if(!cur){return;} if(cur.erase){cur=null;return;}
  const c=cur;cur=null;liveDraw();if(e.type==="pointercancel")return;
  let len=0;for(let i=1;i<c.pts.length;i++)len+=Math.hypot(c.pts[i][0]-c.pts[i-1][0],c.pts[i][1]-c.pts[i-1][1]);
  if(len<12)return;
  const l=c.pts[c.pts.length-1];const en=findNode(l[0],l[1]);const s=c.s;
  snap();
  const mk=n=>{if(!n)return null;if(n.id)return n.id;const id="J"+(st.seq++);st.joints[id]={id,x:+n.x.toFixed(1),y:+n.y.toFixed(1),box:n.box};return id;};
  const a=mk(s);let b;
  if(en&&en.newJoint&&s&&s.newJoint&&Math.hypot(en.x-s.x,en.y-s.y)<8){undo.pop();return;}
  b=mk(en);
  if(a&&b&&a===b){undo.pop();cleanJoints();return;}
  const pts=c.pts.map(q=>[+q[0].toFixed(1),+q[1].toFixed(1)]);
  if(a){const n=a.startsWith("T:")?build(P[pi]).terms[a.slice(2)]:st.joints[a];pts[0]=[n.x,n.y];}
  if(b){const n=b.startsWith("T:")?build(P[pi]).terms[b.slice(2)]:st.joints[b];pts[pts.length-1]=[n.x,n.y];}
  st.wires.push({id:st.seq++,c:color,pts:simplify(pts),a,b});render();}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
function simplify(pts){if(pts.length<4)return pts;const out=[pts[0]];for(let i=1;i<pts.length-1;i++){const l=out[out.length-1];if(Math.hypot(pts[i][0]-l[0],pts[i][1]-l[1])>=6)out.push(pts[i]);}out.push(pts[pts.length-1]);return out;}

/* ============ UI ============ */
const sel=document.getElementById("sel");P.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent="No."+p.no+" "+p.title;sel.appendChild(o);});
sel.addEventListener("change",()=>setProblem(+sel.value));
document.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{color=b.dataset.c;erase=false;updTools();}));
document.getElementById("bErase").addEventListener("click",()=>{erase=!erase;updTools();});
function updTools(){document.querySelectorAll("[data-c]").forEach(b=>b.classList.toggle("on",!erase&&b.dataset.c===color));document.getElementById("bErase").classList.toggle("on",erase);}
document.getElementById("bUndo").addEventListener("click",()=>{if(!undo.length){toast("これ以上戻せません");return;}st=JSON.parse(undo.pop());render();});
const modal=document.getElementById("modal");
document.getElementById("bClear").addEventListener("click",()=>modal.classList.add("open"));
document.getElementById("mNo").addEventListener("click",()=>modal.classList.remove("open"));
document.getElementById("mYes").addEventListener("click",()=>{snap();st={wires:[],joints:{},seq:st.seq};render();modal.classList.remove("open");});
document.getElementById("bAns").addEventListener("click",e=>{showAns=!showAns;gA.style.display=showAns?"":"none";e.currentTarget.classList.toggle("on",showAns);if(showAns)toast("正解例を表示中（2心＝黒白・3心＝黒白赤で配色）");});
document.getElementById("bFit").addEventListener("click",fit);
const sheet=document.getElementById("sheet");
function openSheet(t,h){document.getElementById("shTitle").textContent=t;document.getElementById("shBody").innerHTML=h;sheet.classList.add("open");}
function closeSheet(){sheet.classList.remove("open");}
document.getElementById("shClose").addEventListener("click",closeSheet);
document.getElementById("bCheck").addEventListener("click",()=>{const p=P[pi];if(!st.wires.length){toast("まず線を描いてください");return;}const r=check(p,st);
  let h=`<div class="verdict ${r.pass?"ok":"ng"}">${r.pass?"◎ 正解！ 結線・色ともOK":"✖ まだ違うところがあります"}</div>`;
  if(r.pass)h+=`<div class="msg ok"><span class="ic">✓</span><span>すべての端子が正しい相手とつながっています（接続点 ${r.joints} か所）</span></div>`;
  for(const m of r.msgs)h+=`<div class="msg ${m.lv}"><span class="ic">${m.lv==="ng"?"✖":"!"}</span><span>${esc(m.t)}</span></div>`;
  h+=`<div class="note">※ 器具の2端子（どちらに白を付けるか）や3路の1・3の入れ替えなど、電気的に同じになる結線は正解として扱います。</div>`;
  openSheet("No."+p.no+" 判定",h);});
document.getElementById("bInfo").addEventListener("click",()=>{const p=P[pi];
  openSheet("No."+p.no+" "+p.title,`<div class="cond"><ul>${p.desc.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
  <h3>電線の色（本番）</h3><ul><li>2心ケーブル：黒・白、3心ケーブル：黒・白・赤</li><li>黒＝電源の非接地側、白＝接地側、赤＝返り線・渡り線など（残りの色）</li><li>判定では「接地側は白」「非接地側は黒」「接地線は緑」を確認します。返り線・渡り線の色はケーブルの残りの色になるため自由です。</li></ul><h3>使い方</h3><ul><li>1本指でなぞると線が引けます。端子（○）やボックス内の接続点（●）に近づけると吸着します。</li><li>ジョイントボックス（点線）の中で指を離すと接続点ができ、同じ点に別の線をつなげると「接続」になります。</li><li>2本指で拡大・移動、「全体」で元の表示に戻ります。</li><li>赤い○は、どこにもつながっていない線の端です。</li></ul>
  <div class="note">※ 器具の配置は公表された候補問題の単線図をもとに再現しています。実際の試験では施工条件（電線の色・接続方法・寸法）を必ず確認してください。</div></div>`);});
let tt;function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600);}

window.__dump=()=>P.map(p=>{const {segs}=modelSegs(p);const c={};segs.forEach(g=>{const k=g.cab?("C "+g.cab):("J "+g.jmp);(c[k]=c[k]||[]).push((p.nets[g.net].role||"·")+":"+g.c);});return "No."+p.no+"\n"+Object.entries(c).map(([k,v])=>"  "+k+"  "+v.join(" ")).join("\n");}).join("\n");
window.__inside=i=>{const p=P[i];const B=build(p);const {segs}=modelSegs(p);const bad=[];
  segs.forEach(sg=>{const pts=sg.pts;for(let k=0;k+1<pts.length;k++){const a=pts[k],b=pts[k+1];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const n=Math.ceil(L/3);
    for(let j=1;j<n;j++){const x=a[0]+(b[0]-a[0])*j/n,y=a[1]+(b[1]-a[1])*j/n;
      for(const id in B.compById){const bb=B.compById[id].bb;if(x>bb[0]+2&&x<bb[2]-2&&y>bb[1]+2&&y<bb[3]-2){bad.push(id+"@"+sg.a+"-"+sg.b);j=n;break;}}}}});return [...new Set(bad)];};
window.__ms=modelSegs;
window.__overlap=i=>{const {segs}=modelSegs(P[i]);const pcs=[];segs.forEach((sg,si)=>{const pts=sg.pts;for(let k=0;k+1<pts.length;k++){const a=pts[k],b=pts[k+1];if(Math.abs(a[1]-b[1])<0.01)pcs.push({si,o:"h",c:a[1],a:Math.min(a[0],b[0]),b:Math.max(a[0],b[0])});else if(Math.abs(a[0]-b[0])<0.01)pcs.push({si,o:"v",c:a[0],a:Math.min(a[1],b[1]),b:Math.max(a[1],b[1])});}});
  let tot=0;for(let x=0;x<pcs.length;x++)for(let y=x+1;y<pcs.length;y++){const p=pcs[x],q=pcs[y];if(p.si===q.si||p.o!==q.o||Math.abs(p.c-q.c)>6)continue;const ov=Math.min(p.b,q.b)-Math.max(p.a,q.a);if(ov>4)tot+=ov-4;}return Math.round(tot);};
// 3つの条件の自動検査：重なり・器具の貫通・ほかの接続点/端子の通過
window.__validate=i=>{const p=P[i];const B=build(p);const {segs}=modelSegs(p);const res={overlap:[],through:[],joint:[],term:[]};
  const SH=[];for(const [id,v] of Object.entries(B.compById))for(const sh of v.shapes)SH.push(Object.assign({id},sh));
  const JN={};segs.forEach(g=>{if(!g.a.startsWith("T:"))JN[g.a]=[g.ax,g.ay];if(!g.b.startsWith("T:"))JN[g.b]=[g.bx,g.by];});
  const inside=(x,y,sh,m)=>sh.t==="c"?Math.hypot(x-sh.x,y-sh.y)<sh.r-m:(x>sh.b[0]+m&&x<sh.b[2]-m&&y>sh.b[1]+m&&y<sh.b[3]-m);
  const nm=g=>g.a+">"+g.b;
  segs.forEach(g=>{const ends=[g.a,g.b];const ownT=ends.filter(e=>e.startsWith("T:")).map(e=>B.terms[e.slice(2)]);
    const pts=g.pts;for(let k=0;k+1<pts.length;k++){const a=pts[k],b=pts[k+1];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const n=Math.max(1,Math.ceil(L/2));
      for(let j=0;j<=n;j++){const x=a[0]+(b[0]-a[0])*j/n,y=a[1]+(b[1]-a[1])*j/n;if(ownT.some(t=>Math.hypot(t.x-x,t.y-y)<4))continue;
        for(const sh of SH)if(inside(x,y,sh,1.5)){res.through.push(nm(g)+" @"+sh.id);break;}
        for(const jid in JN){if(ends.includes(jid))continue;if(Math.hypot(JN[jid][0]-x,JN[jid][1]-y)<10){res.joint.push(nm(g)+" @"+jid);}}
        for(const tid in B.terms){if(ends.includes("T:"+tid))continue;const t=B.terms[tid];if(Math.hypot(t.x-x,t.y-y)<8)res.term.push(nm(g)+" @"+tid);}}}});
  const pcs=[];segs.forEach((g,si)=>{const pts=g.pts;for(let k=0;k+1<pts.length;k++){const a=pts[k],b=pts[k+1];if(Math.abs(a[1]-b[1])<0.01)pcs.push({si,o:"h",c:a[1],a:Math.min(a[0],b[0]),b:Math.max(a[0],b[0])});else if(Math.abs(a[0]-b[0])<0.01)pcs.push({si,o:"v",c:a[0],a:Math.min(a[1],b[1]),b:Math.max(a[1],b[1])});}});
  for(let x=0;x<pcs.length;x++)for(let y=x+1;y<pcs.length;y++){const p1=pcs[x],q=pcs[y];if(p1.si===q.si||p1.o!==q.o||Math.abs(p1.c-q.c)>5)continue;const ov=Math.min(p1.b,q.b)-Math.max(p1.a,q.a);if(ov>4)res.overlap.push(nm(segs[p1.si])+" & "+nm(segs[q.si])+" "+Math.round(ov));}
  for(const k in res)res[k]=[...new Set(res[k])];return res;};
// テスト用フック
window.__app={P,check:()=>check(P[pi],st),setProblem,
  loadAnswer(){const {segs,joints}=modelSegs(P[pi]);st={wires:[],joints:{},seq:1};joints.forEach(j=>st.joints[j.id]={id:j.id,x:j.x,y:j.y,box:j.box});segs.forEach(s=>st.wires.push({id:st.seq++,c:s.c,pts:s.pts.map(p=>[p[0],p[1]]),a:s.a,b:s.b}));render();},
  state:()=>st,setState:s=>{st=s;render();}};

let start=0;try{start=+(localStorage.getItem(KEY+"last")||0)||0;}catch(e){}
setProblem(Math.min(start,P.length-1));
})();
</script>
